<!DOCTYPE html>
<html>
<head>
    <title>DevOps Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>DevOps Todo App</h1>

    <div id="authSection">

        <h2>Register</h2>

        <input
            type="text"
            id="registerUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button onclick="registerUser()">
            Register
        </button>

        <hr>

        <h2>Login</h2>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="loginUser()">
            Login
        </button>

    </div>

    <div id="todoSection" style="display:none;">
	
        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

        <hr>

        <input
            type="text"
            id="todoInput"
            placeholder="Enter Todo"
        >

        <button onclick="addTodo()">
            Add Todo
        </button>

        <ul id="todoList"></ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
